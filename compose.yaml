name: mrbuffalo-local
services:
  gateway:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:${HTTP_PORT:-8088}:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
    networks: [entry, local]
  web:
    image: mrbuffalo-local-php:8.3
    build: ./infra/php
    volumes:
      - site:/var/www/html
      - ./local:/var/www/html/local:ro
      - ./infra/check.php:/opt/mrbuffalo/check.php:ro
    environment:
      LOCAL_HTTP_PORT: ${HTTP_PORT:-8088}
      MYSQL_HOST: db
      MYSQL_DATABASE: mrbuffalo
      MYSQL_USER: mrbuffalo
      MYSQL_PASSWORD: ${DB_PASSWORD:?Run scripts/local.ps1 up first}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "/opt/mrbuffalo/check.php"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks: [local]
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: mrbuffalo
      MYSQL_USER: mrbuffalo
      MYSQL_PASSWORD: ${DB_PASSWORD:?Run scripts/local.ps1 up first}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Run scripts/local.ps1 up first}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --transaction-isolation=READ-COMMITTED
      - --innodb-strict-mode=OFF
      - --max-allowed-packet=128M
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u$$MYSQL_USER $$MYSQL_DATABASE -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [local]
volumes:
  site:
  database:
networks:
  entry:
  local:
    internal: true
